[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reachable"
version = "0.1.0"
description = "Triage security findings by whether anything can actually reach them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# The core is stdlib only. This stays empty on purpose -- see PLAN.md before adding anything.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
reachable = "reachable.cli:main"

[tool.setuptools.packages.find]
include = ["reachable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
