[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reachable"
version = "0.1.0"
description = "Triage security findings by whether anything can actually reach them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Harshvardhan" }]
keywords = ["security", "sast", "reachability", "call-graph", "semgrep", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# The core is stdlib only. This stays empty on purpose -- see CONTRIBUTING.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
reachable = "reachable.cli:main"

[tool.setuptools.packages.find]
include = ["reachable*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
