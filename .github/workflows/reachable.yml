name: reachable

# Runs the reachability triage on every pull request and posts only the findings that
# something can actually reach. Public repositories get unlimited Actions minutes, so this
# costs nothing to run.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Every scanner below is optional. `reachable` skips whatever is missing and still runs
      # its built-in rules, so a failure here degrades the report rather than the job -- and
      # since a scanner that does not complete is now reported as INCOMPLETE rather than as
      # zero findings, a silent install failure cannot be mistaken for a clean scan.
      #
      # Versions are pinned, and each download is checked against the checksums file published
      # with that same release. Be precise about what that buys: it detects a corrupted or
      # truncated transfer, not a compromised release -- the checksums come from the same
      # origin as the binary. Pinning the version is what actually limits the blast radius.
      #
      # What it replaces matters more. `curl | sh` against a *branch* URL executes whatever
      # that branch contains at the moment the job runs: an unreviewed remote script with
      # write access to the workspace. Not worth it anywhere, indefensible in the CI of a
      # security tool.
      - name: Install scanners
        continue-on-error: true
        env:
          OSV_VERSION: "1.9.1"
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          pip install "semgrep==1.95.0"

          osv_base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL -o osv-scanner "${osv_base}/osv-scanner_linux_amd64"
          curl -sSfL -o osv_checksums.txt "${osv_base}/osv-scanner_${OSV_VERSION}_checksums.txt"
          grep " osv-scanner_linux_amd64\$" osv_checksums.txt \
            | sed 's/osv-scanner_linux_amd64/osv-scanner/' | sha256sum -c -
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/

          gl_base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          gl_tar="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${gl_tar}" "${gl_base}/${gl_tar}"
          curl -sSfL -o gl_checksums.txt "${gl_base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${gl_tar}\$" gl_checksums.txt | sha256sum -c -
          tar -xzf "${gl_tar}" gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run reachability triage
        run: python -m reachable scan . --out ./out

      - uses: actions/upload-artifact@v4
        with:
          name: reachable-report
          path: out/

      # `on: pull_request` gives fork PRs a read-only token, so commenting fails there. That
      # is the correct trade: `pull_request_target` would hand a write-scoped token to
      # untrusted PR code. The report is still uploaded as an artifact above, so nothing is
      # lost -- hence continue-on-error rather than a hard failure.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('out/findings.json', 'utf8')).summary;
            let body = fs.readFileSync('out/report.md', 'utf8');

            // GitHub rejects comments over 65536 characters.
            const LIMIT = 60000;
            if (body.length > LIMIT) {
              body = body.slice(0, LIMIT) + '\n\n_Report truncated. Full version in the run artifacts._';
            }

            const marker = '<!-- reachable-report -->';
            body = `${marker}\n${body}`;

            // Update the existing comment instead of stacking a new one on every push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            core.notice(`${summary.findings} findings, ${summary.reachable} reachable`);
